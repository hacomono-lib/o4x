services:
  postgres:
    build:
      context: ../..
      dockerfile: examples/local/Dockerfile.postgres
    container_name: o4x-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: o4x
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: o4x-localstack
    environment:
      SERVICES: sqs
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "14566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  localstack-data:
