name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.23.x]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: o4x
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:3.7
        env:
          SERVICES: sqs
          DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules and build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
          ${{ runner.os }}-go-

    - name: Set Go environment variables
      run: |
        echo "GOCACHE=$HOME/.cache/go-build" >> $GITHUB_ENV
        echo "GOMODCACHE=$HOME/go/pkg/mod" >> $GITHUB_ENV

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
        sleep 5

    - name: Initialize database schema
      env:
        PGPASSWORD: postgres
      run: |
        # Generate schema.sql if it doesn't exist
        if [ ! -f scripts/schema.sql ]; then
          go run cmd/o4x-schema/main.go --with-inbox > scripts/schema.sql
        fi

        # Apply schema to test database
        psql -h localhost -U postgres -d o4x -f scripts/schema.sql

    - name: Run tests with coverage
      env:
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/o4x?sslmode=disable
        SQS_ENDPOINT: http://localhost:4566
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
      run: |
        go test ./contrib/... ./core/... ./schema/... -v -race -coverprofile=coverage.out -covermode=atomic -p 1

    - name: Generate coverage report
      run: |
        go tool cover -func=coverage.out -o coverage.txt
        cat coverage.txt

    - name: Check coverage threshold
      run: |
        # Extract overall coverage percentage
        total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${total}%"

        # Set minimum threshold (library code only, excludes examples/app)
        threshold=80.0

        if (( $(echo "$total < $threshold" | bc -l) )); then
          echo "❌ Coverage ${total}% is below threshold ${threshold}%"
          exit 1
        else
          echo "✅ Coverage ${total}% meets threshold ${threshold}%"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.23.x

    - name: Cache Go modules and build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.23.x-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.23.x-
          ${{ runner.os }}-go-

    - name: Set Go environment variables
      run: |
        echo "GOCACHE=$HOME/.cache/go-build" >> $GITHUB_ENV
        echo "GOMODCACHE=$HOME/go/pkg/mod" >> $GITHUB_ENV

    - name: Run golangci-lint with reviewdog
      uses: reviewdog/action-golangci-lint@v2
      with:
        golangci_lint_version: latest
        reporter: github-pr-review
        level: error
        fail_level: error

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.23.x

    - name: Cache Go modules and build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.23.x-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.23.x-
          ${{ runner.os }}-go-

    - name: Set Go environment variables
      run: |
        echo "GOCACHE=$HOME/.cache/go-build" >> $GITHUB_ENV
        echo "GOMODCACHE=$HOME/go/pkg/mod" >> $GITHUB_ENV
        echo "GOBIN=$HOME/go/bin" >> $GITHUB_ENV

    - name: Cache Gosec binary
      uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-gosec-v2-latest

    - name: Install Gosec
      run: |
        if [ ! -f "$HOME/go/bin/gosec" ]; then
          go install github.com/securego/gosec/v2/cmd/gosec@latest
        fi

    - name: Run Gosec Security Scanner
      run: |
        $HOME/go/bin/gosec -no-fail -fmt sarif -out results.sarif ./...
      continue-on-error: true

    - name: Display Security Results
      run: |
        if [ -f results.sarif ]; then
          echo "Security scan completed. Results saved to results.sarif"
          # Display basic summary (optional)
          jq -r '.runs[0].results[] | "Issue: " + .ruleId + " - " + .message.text' results.sarif 2>/dev/null || echo "No security issues found"
        fi
      if: always()
